# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-robotframework
  version: 4.6.3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pytest_robotframework-${{ version }}.tar.gz
  sha256: e4c6fde4ae332882c81bfe3c6adfbae79caac0b7a9c8337151ab3308921618dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - pytest >=7,<10
    - robotframework >=6.1,<8.0.0
    - ansi2html >=1.9.1
    - typing_extensions
    - pluggy
tests:
  - python:
      imports:
        - pytest_robotframework
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://detachhead.github.io/pytest-robotframework/latest/
  repository: https://github.com/detachhead/pytest-robotframework
  summary: A pytest plugin that can run both python and robotframework tests while generating robot reports for them.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - DetachHead
    - rxm7706
